name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PAPERSHELF_DB_PASSWORD: ci-only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: papershelf
          POSTGRES_USER: papershelf
          POSTGRES_PASSWORD: ci-only
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
