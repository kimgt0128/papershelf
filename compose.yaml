name: papershelf
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: papershelf
      POSTGRES_USER: papershelf
      POSTGRES_PASSWORD: ${PAPERSHELF_DB_PASSWORD:?Set PAPERSHELF_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PAPERSHELF_DB_PORT:-15433}:5432"
    volumes:
      - papershelf-data:/var/lib/postgresql/data
      - ./docker/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papershelf -d papershelf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  papershelf-data:
