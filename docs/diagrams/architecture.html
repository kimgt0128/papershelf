<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperShelf 아키텍처</title>
  <style>
    body { margin: 0; padding: 24px; background: #f5f5f5; color: #2d3142; }
    main { max-width: 960px; margin: auto; }
    h1 { font: 400 28px 'Instrument Serif', 'AppleMyungjo', serif; }
    .diagram-container { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    @media print { svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>PaperShelf 아키텍처</h1>
    <div class="diagram-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364"
           role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">PaperShelf 작업 접수와 논문 검색</title>
        <desc id="architecture-desc">현재는 API가 작업을 PostgreSQL에 접수하며, 향후 워커가 대기 작업의 논문을 색인하면 검색기가 질문에 맞는 원문 문단을 찾아 인용한다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M1 1 L7 4 L1 7" fill="none" stroke="#4f5d75" stroke-width="1.3"/>
          </marker>
        </defs>
        <rect width="960" height="364" fill="#f5f5f5"/>
        <g font-family="Geist, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
          <g fill="#2d3142" font-weight="600">
            <text x="36" y="48" font-size="16">현재 구현</text>
            <text x="152" y="48" font-size="21">작업 접수와 상태 조회</text>
            <text x="36" y="224" font-size="16">구현 계획</text>
            <text x="152" y="224" font-size="21">논문 색인과 근거 검색</text>
          </g>
          <g stroke="#bfc0c0" fill="none">
            <path d="M128 32 V52 M128 208 V228"/>
            <path d="M36 180 H924"/>
          </g>
          <g stroke="#4f5d75" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
            <path d="M300 112 H344"/><path d="M612 112 H656"/>
            <path d="M300 288 H344"/><path d="M612 288 H656"/>
          </g>
          <g fill="#fff" stroke="#4f5d75">
            <rect x="36" y="72" width="264" height="80" rx="6"/>
            <rect x="348" y="72" width="264" height="80" rx="6"/>
            <rect x="660" y="72" width="264" height="80" rx="6"/>
            <rect x="36" y="248" width="264" height="80" rx="6"/>
            <rect x="348" y="248" width="264" height="80" rx="6"/>
            <rect x="660" y="248" width="264" height="80" rx="6" fill="#fcf1ed" stroke="#bf4520" stroke-width="1.6"/>
          </g>
          <g font-size="19" font-weight="600" fill="#2d3142">
            <text x="56" y="106">클라이언트</text>
            <text x="368" y="106">Spring Boot API</text>
            <text x="680" y="106">PostgreSQL</text>
            <text x="56" y="282">색인 워커</text>
            <text x="368" y="282">문단 색인</text>
            <text x="680" y="282" fill="#9b3619">근거 검색과 인용</text>
          </g>
          <g font-size="15" fill="#4f5d75">
            <text x="56" y="132" font-family="'Geist Mono', Menlo, monospace" font-size="12">POST /ingest · GET /jobs/{jobId}</text>
            <text x="368" y="132">접수 · 작업 ID로 상태 조회</text>
            <text x="680" y="132">작업 상태 저장 · QUEUED</text>
            <text x="56" y="308">대기 작업 → 분할·임베딩</text>
            <text x="368" y="308">pgvector · 버전별 원문 위치</text>
            <text x="680" y="308">질문에 맞는 문단과 원문 링크</text>
          </g>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
